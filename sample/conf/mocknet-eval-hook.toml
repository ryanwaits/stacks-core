# Mocknet + eval-hook traces for a local Secondlayer indexer.
# Requires this fork's stacks-node (stock binaries panic on unknown events_keys).
#
# Start indexer first (port 3700), then:
#   stacks-node start --config=sample/conf/mocknet-eval-hook.toml

[node]
working_dir = "/tmp/stacks-mocknet-eval-hook"
rpc_bind = "127.0.0.1:20443"
p2p_bind = "127.0.0.1:20444"
miner = true
mock_mining = true
mine_microblocks = false
seed = "b8d99fd45da58038d630d9855d3ca2466e8e0f89d3894c4724f0efc9ff4b51f0"

[burnchain]
mode = "mocknet"
# Mocknet default cycle length 5 puts epoch 3.0 at offset 1 (forbidden).
pox_reward_length = 11
pox_prepare_length = 3
commit_anchor_block_within = 3000

[[ustx_balance]]
address = "ST2QKZ4FKHAH1NQKYKYAYZPY440FEPK7GZ1R5HBP2"
amount = 10000000000000000

[[ustx_balance]]
address = "ST319CF5WV77KYR1H3GT0GZ7B8Q4AQPY42ETP1VPF"
amount = 10000000000000000

# local test key 11…11 (testnet version)
[[ustx_balance]]
address = "ST3Y74M5227FDVHREWPH773F5Y1W1ED8WXXVB0G1S"
amount = 10000000000000000

# stacks-node/Stacks.toml helium account (known secret)
# Private key: b8d99fd45da58038d630d9855d3ca2466e8e0f89d3894c4724f0efc9ff4b51f001
[[ustx_balance]]
address = "ST2ZRX0K27GW0SP3GJCEMHD95TQGJMKB7G9Y0X1MH"
amount = 10000000000000000

[[events_observer]]
endpoint = "127.0.0.1:3700"
events_keys = ["*", "storage", "contract_calls"]
timeout_ms = 10000
disable_retries = false

# Same epoch list as sample testnet miner, so Epoch 4.0 exists and 3.0 is
# not on a mocknet cycle boundary.
[[burnchain.epochs]]
epoch_name = "1.0"
start_height = 0

[[burnchain.epochs]]
epoch_name = "2.0"
start_height = 0

[[burnchain.epochs]]
epoch_name = "2.05"
start_height = 1

# 2.1 after a few helium blocks; 2.2+ far so we can deploy Clarity 2
# without hitting the next BlockCommitBadEpoch boundary.
[[burnchain.epochs]]
epoch_name = "2.1"
start_height = 8

[[burnchain.epochs]]
epoch_name = "2.2"
start_height = 8000

[[burnchain.epochs]]
