type: object
properties:
  block_hash:
    type: string
    description: Hash of the block
    pattern: "^[0-9a-f]{64}$"
  block_id:
    type: string
    description: Block ID (index block hash)
    pattern: "^[0-9a-f]{64}$"
  block_height:
    type: integer
    description: Height of the Stacks block
    format: uint64
  consensus_hash:
    type: string
    description: Consensus hash of the tenure
    pattern: "^[0-9a-f]{40}$"
  fees:
    type: integer
    description: total fees for the block
  miner_signature:
    type: string
    description: Uncompressed signature of the miner
    pattern: "^[0-9a-f]{130}$"
  parent_block_id:
    type: string
    description: Parent Block ID (index block hash)
    pattern: "^[0-9a-f]{64}$"
  signer_signature:
    type: array
    items:
      type: string
      description: Uncompressed signature of the signer
      pattern: "^[0-9a-f]{130}$"
  state_index_root:
    type: string
    pattern: "^[0-9a-f]{64}$"
    description: block state index root computed from the MARF (got from the original block)
  timestamp:
    type: integer
  tx_merkle_root:
    type: string
    description: merkle_root of the included transactions
  valid_merkle_root:
    type: boolean
    description: does the merkle_root matches the chain block and the simulated one?
  transactions:
    type: array
    items:
      $ref: "./block-replay-transaction.schema.yaml"
  vm_events:
    type: array
    description: |
      Eval-hook VM traces of the replayed block, in block order, serialized as
      `/new_block.vm_events`. Present only when requested with `vm_events=1`.
    items:
      type: object
  state_writes:
    type: array
    description: |
      Every Clarity MARF write the replayed block made, in write order, as
      `/new_block.state_writes`. `tx_index` is the position in `transactions`.
      Present only when requested with `state_writes=1`.
    items:
      type: object
      properties:
        tx_index:
          type: integer
          nullable: true
          description: Producing transaction, or null for a block-level write
        ordinal:
          type: integer
          description: Position in the block's write order, from 0
        key:
          type: string
          description: MARF key string
        value_hex:
          type: string
          description: Hex of the side-store value string's bytes
      required:
        - tx_index
        - ordinal
        - key
        - value_hex
required:
  - block_hash
  - block_id
  - block_height
  - consensus_hash
  - fees
  - miner_signature
  - parent_block_id
  - signer_signature
  - state_index_root
  - timestamp
  - tx_merkle_root
  - valid_merkle_root
  - transactions
